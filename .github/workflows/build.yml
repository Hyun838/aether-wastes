name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AetherWastes
          path: build/libs/*.jar
      - name: Publish jar to dist branch
        run: |
          mkdir out
          for f in build/libs/*.jar; do case "$f" in *sources*) ;; *) cp "$f" out/AetherWastes.jar;; esac; done
          cd out
          git init -q
          git checkout -q -b dist
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "AetherWastes.jar from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" dist
