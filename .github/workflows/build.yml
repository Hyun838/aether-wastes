name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Publish Minecraft sources once (for development)
        continue-on-error: true
        run: |
          if git ls-remote --exit-code origin mcsrc2 >/dev/null 2>&1; then exit 0; fi
          ./gradlew createMinecraftArtifacts --no-daemon -q || true
          find build .gradle ~/.gradle -name "*.jar" 2>/dev/null | grep -i -E "sources|minecraft" | head -40
          J=""; for c in $(find build .gradle ~/.gradle -name "*sources*.jar" 2>/dev/null); do unzip -l "$c" 2>/dev/null | grep -q "net/minecraft/world/entity/Entity.java" && J="$c" && break; done
          echo "sources: $J"; test -n "$J"
          mkdir -p srcout && cp "$J" srcout/mc-sources.jar && cd srcout && git init -q && git checkout -q -b mcsrc2 && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m src \
            && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" mcsrc2
      - name: Launch test (server loads the mod and its worlds)
        timeout-minutes: 15
        continue-on-error: true
        run: ./gradlew runGameTestServer --no-daemon > gametest.log 2>&1; echo "exit=$?" >> gametest.log
      - name: Client launch and in-game screenshots (virtual screen)
        timeout-minutes: 40
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          export AW_AUTOSHOTS=true
          mkdir -p run && printf 'onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:8\nnarrator:0\ntutorialStep:none\nskipMultiplayerWarning:true\nguiScale:2\n' > run/options.txt
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            ./gradlew runClient --no-daemon > client.log 2>&1 &
            for i in $(seq 1 420); do sleep 5; grep -q "\[aw-shot\] done" client.log && break; grep -q "Stopping!" client.log && break; done
            import -window root client.png || true
            sleep 10; pkill -f java || true' || true
          mkdir -p shots && cp run/screenshots/aw_*.png shots/ 2>/dev/null || true
          ls -la shots || true
      - uses: actions/upload-artifact@v4
        with:
          name: AetherWastes
          path: build/libs/*.jar
      - name: Publish jar and logs to dist branch
        if: always()
        run: |
          mkdir -p out
          for f in build/libs/*.jar; do case "$f" in *sources*) ;; *) cp "$f" out/AetherWastes.jar;; esac; done
          cp build.log gametest.log client.log client.png out/ 2>/dev/null || true
          mkdir -p out/shots && cp shots/*.png out/shots/ 2>/dev/null || true
          cd out
          git init -q
          git checkout -q -b dist
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "build ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" dist
